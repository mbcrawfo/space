[project]
name = "space"
version = "0.0.0"
description = "A collection of small Python tools"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
# Pinned so local runs and CI use the same uv. astral-sh/setup-uv reads this, so the
# workflow needs no separate version. Bumping it means bumping the installed uv too.
required-version = "==0.12.5"

[tool.uv.workspace]
members = ["lightspeed", "spacetime", "starlight"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16.3"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Tools are packages under the repo root, so that is the first-party import root.
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "TID", "RUF"]
ignore = [
    "E501",   # line length is the formatter's job
    "RUF001", # Greek letters in Bayer designations are intentional, not homoglyphs
    "RUF002", # same, in docstrings
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG"]
"**/conftest.py" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# The repo root on sys.path is what lets tests import a tool as `starlight.catalog`.
pythonpath = ["."]
# Two tools may deliberately carry same-named test modules (e.g. two tools both
# testing a duplicated catalog.py), and tests/ directories have no __init__.py.
# Without a package marker, pytest's default import mode collides on the name;
# importlib mode keys each test module by its file path instead, so it can tell
# same-named modules in different tools apart.
addopts = "-ra --strict-markers --import-mode=importlib"
# VTK's numpy_support still sets ndarray.shape in place, which NumPy ≥ 2.5 deprecates; the
# warning is VTK's to fix, not ours. Drop this filter once the pinned vtk stops emitting it.
filterwarnings = ["ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:vtkmodules.util.numpy_support"]
